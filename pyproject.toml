[project]
name = "evopi"
version = "0.3.0"
description = "An evolution-ready Python agent runtime with pluggable harness and policy governance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "WeiSuanDi" },
]
keywords = ["agent", "policy", "runtime", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
remote = [
    "cryptography>=44.0.0",
    "starlette>=0.45.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]
dev = [
    "build>=1.2.2",
    "cryptography>=44.0.0",
    "httpx2>=2.0.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "ruff==0.15.22",
    "starlette>=0.45.0",
    "twine>=5.1.1",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

[project.urls]
Homepage = "https://github.com/WeiSuanDi/EvoPi"
Repository = "https://github.com/WeiSuanDi/EvoPi"
Issues = "https://github.com/WeiSuanDi/EvoPi/issues"

[project.scripts]
evopi = "evopi.cli.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["evopi*"]

[tool.setuptools.package-data]
"evopi.plugins" = ["sdk_templates/**/*"]
"evopi.evolution" = ["policy_templates/**/*"]
"evopi.remote" = ["console/*"]
"evopi" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["references", ".tmp"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["evopi"]
exclude = "^(references|\\.tmp)/"
